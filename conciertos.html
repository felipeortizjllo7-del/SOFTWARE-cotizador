<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="Pragma" content="no-cache">
<title>Conciertos - INNOBA DMC</title>
<style>
:root{--navy:#013984;--blue:#1466C7;--cyan:#22B3C9;--gold:#E0A526;--bg:#eef2f8;--card:#fff;--muted:#6b7a90;--line:#dde5f0;--txt:#12243b;--green:#1E9E5A;--red:#D64545}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:'Segoe UI',system-ui,Arial,sans-serif}
.top{background:linear-gradient(120deg,#012a63,#013984 55%,#1466C7);color:#fff;padding:22px 16px 26px}
.top .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{background:#fff;border-radius:12px;padding:8px 12px;display:inline-flex}
.logo img{height:40px;display:block}
.top h1{font-size:26px;margin:0;font-weight:800;letter-spacing:.2px}
.top p{margin:2px 0 0;color:#cfe0f6;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.filtros{display:flex;gap:10px;flex-wrap:wrap;margin:-30px 0 18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(1,57,132,.08)}
.filtros input,.filtros select{height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px;background:#fff;color:var(--txt)}
.filtros input{flex:2;min-width:200px}.filtros select{flex:1;min-width:150px}
.mes-h{grid-column:1/-1;font-size:18px;font-weight:800;color:var(--navy);margin:14px 4px 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(1,57,132,.07);display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(1,57,132,.16)}
.banner{height:120px;position:relative;display:flex;align-items:flex-end;padding:12px 14px;color:#fff}
.banner .art{font-size:22px;font-weight:800;line-height:1.1;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.badge{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.95);color:var(--navy);border-radius:10px;padding:5px 10px;font-weight:800;font-size:13px;text-align:center;line-height:1.05}
.badge small{display:block;font-size:10px;font-weight:700;color:var(--blue)}
.body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.sub{color:var(--muted);font-size:13px;margin-top:-2px}
.row{display:flex;align-items:center;gap:6px;color:var(--txt);font-size:14px}
.row .ic{color:var(--blue)}
.locs{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;border:1px solid}
.ok{background:#e7f6ee;color:var(--green);border-color:#bfe6cf}
.no{background:#fdeaea;color:var(--red);border-color:#f3c7c7;text-decoration:line-through}
.cta{margin-top:auto;display:flex;gap:8px}
.btn{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:11px 8px;font-weight:800;font-size:14px}
.btn.res{background:var(--gold);color:#3a2b05}.btn.res:hover{background:#c98f16}
.vacio{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 10px;font-size:16px}
.foot{max-width:1180px;margin:0 auto;padding:20px 16px 40px;color:var(--muted);font-size:13px;text-align:center}
@media(max-width:520px){.top h1{font-size:21px}.grid{grid-template-columns:1fr}}
</style></head><body>

function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}

 const q=norm(document.getElementById("q").value),fc=selC.value,fm=selM.value;
 let items=DATA.filter(c=>{
   if(fc&&c.ciudad!==fc)return false; if(fm&&c.mes!==fm)return false;

 });
